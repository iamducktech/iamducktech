<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121815"/>
      <stop offset="100%" stop-color="#080A09"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AFE746" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7FAF32" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#202722" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#202722" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="320" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="918" height="318" rx="11" fill="url(#hero-grad)" stroke="#202722" stroke-width="1"/>
  
  <!-- Technical Grid Overlay (Hero Section) -->
  <rect x="2" y="2" width="916" height="316" rx="11" fill="url(#grid-pattern)"/>

  <!-- Top Accent Bar -->
  <path d="M 12 1 L 908 1" stroke="url(#accent-line)" stroke-width="2"/>

  <!-- Header HUD Status Bar -->
  <g transform="translate(32, 28)">
    <!-- Terminal Identifier -->
    <rect width="76" height="20" rx="4" fill="#101412" stroke="#29332C" stroke-width="1"/>
    <text x="38" y="14" fill="#AFE746" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">SYS://OS</text>

    <!-- System Status Pulse Indicator -->
    <circle cx="98" cy="10" r="4" fill="#AFE746"/>
    <circle cx="98" cy="10" r="7" fill="none" stroke="#AFE746" stroke-width="1" stroke-opacity="0.4"/>
    <text x="114" y="14" fill="#F2F5F2" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM ONLINE</text>

    <!-- Telemetry Tickers (Right aligned) -->
    <g transform="translate(560, 0)">
      <text x="0" y="14" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.5">LOC: <tspan fill="#B8C0BA">0x00_SYS</tspan></text>
      <text x="110" y="14" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.5">NET: <tspan fill="#AFE746">ACTIVE</tspan></text>
      <text x="210" y="14" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="0.5">UPTIME: <tspan fill="#B8C0BA">99.98%</tspan></text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="62" x2="888" y2="62" stroke="#202722" stroke-width="1"/>

  <!-- Identity Block -->
  <g transform="translate(36, 125)">
    <text x="0" y="0" fill="#F2F5F2" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="52" font-weight="800" letter-spacing="4">DUCK</text>
    <text x="4" y="32" fill="#AFE746" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5">FULL-STACK &amp; SYSTEMS DEVELOPER</text>
    <text x="4" y="68" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" letter-spacing="0.2">
      Building software across the entire stack — from architecture and APIs to infrastructure and production.
    </text>
  </g>

  <!-- Bottom Telemetry HUD Matrix -->
  <g transform="translate(32, 240)">
    <!-- Metric 01 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="52" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="52" stroke="#AFE746" stroke-width="3"/>
      <text x="14" y="20" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">STATUS</text>
      <text x="14" y="38" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.5">OPERATIONAL</text>
    </g>

    <!-- Metric 02 -->
    <g transform="translate(220, 0)">
      <rect width="195" height="52" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
      <text x="14" y="20" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">MODE</text>
      <text x="14" y="38" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.5">DEVELOPMENT</text>
    </g>

    <!-- Metric 03 -->
    <g transform="translate(440, 0)">
      <rect width="195" height="52" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
      <text x="14" y="20" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">STACK</text>
      <text x="14" y="38" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.5">FULL-STACK</text>
    </g>

    <!-- Metric 04 -->
    <g transform="translate(660, 0)">
      <rect width="195" height="52" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
      <text x="14" y="20" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">ENVIRONMENT</text>
      <text x="14" y="38" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.5">PRODUCTION</text>
    </g>
  </g>
</svg>
