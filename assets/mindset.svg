<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <rect width="920" height="280" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="918" height="278" rx="11" fill="#080808" stroke="#202722" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">05 // PHILOSOPHY</text>
    <text x="0" y="34" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" letter-spacing="1">ENGINEERING MINDSET</text>
  </g>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#202722" stroke-width="1"/>

  <!-- 4 Principles Grid -->

  <!-- CARD 01 -->
  <g transform="translate(32, 94)">
    <rect width="198" height="152" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <text x="18" y="30" fill="#7FAF32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">01</text>
    <text x="18" y="52" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">CONTROL</text>
    <line x1="18" y1="64" x2="180" y2="64" stroke="#1B221E" stroke-width="1"/>
    <text x="18" y="88" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Understand what's
    </text>
    <text x="18" y="106" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      happening under the
    </text>
    <text x="18" y="124" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      hood.
    </text>
  </g>

  <!-- CARD 02 -->
  <g transform="translate(252, 94)">
    <rect width="198" height="152" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <text x="18" y="30" fill="#7FAF32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">02</text>
    <text x="18" y="52" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">PERFORMANCE</text>
    <line x1="18" y1="64" x2="180" y2="64" stroke="#1B221E" stroke-width="1"/>
    <text x="18" y="88" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Make software fast
    </text>
    <text x="18" y="106" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      because it should be.
    </text>
  </g>

  <!-- CARD 03 -->
  <g transform="translate(472, 94)">
    <rect width="198" height="152" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <text x="18" y="30" fill="#7FAF32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">03</text>
    <text x="18" y="52" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">AUTOMATION</text>
    <line x1="18" y1="64" x2="180" y2="64" stroke="#1B221E" stroke-width="1"/>
    <text x="18" y="88" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      If it can be automated,
    </text>
    <text x="18" y="106" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      it probably should be.
    </text>
  </g>

  <!-- CARD 04 -->
  <g transform="translate(692, 94)">
    <rect width="198" height="152" rx="6" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <text x="18" y="30" fill="#7FAF32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">04</text>
    <text x="18" y="52" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="1">SHIPPING</text>
    <line x1="18" y1="64" x2="180" y2="64" stroke="#1B221E" stroke-width="1"/>
    <text x="18" y="88" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      Ideas are worthless
    </text>
    <text x="18" y="106" fill="#B8C0BA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400">
      until they run.
    </text>
  </g>
</svg>
