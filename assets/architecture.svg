<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#AFE746"/>
    </marker>
    <pattern id="arch-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#202722" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="920" height="620" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="918" height="618" rx="11" fill="#080808" stroke="#202722" stroke-width="1"/>
  <rect x="2" y="2" width="916" height="616" rx="11" fill="url(#arch-grid)"/>

  <!-- Module Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">04 // SYSTEM TOPOLOGY</text>
    <text x="0" y="34" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" letter-spacing="1">ARCHITECTURE &amp; DATA FLOW</text>
  </g>
  <line x1="32" y1="74" x2="888" y2="74" stroke="#202722" stroke-width="1"/>

  <!-- TIER 1: PRODUCT -->
  <g transform="translate(330, 95)">
    <rect width="260" height="52" rx="8" fill="#101412" stroke="#AFE746" stroke-width="1.5"/>
    <circle cx="20" cy="26" r="4" fill="#AFE746"/>
    <text x="36" y="31" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" letter-spacing="2">PRODUCT LAYER</text>
  </g>

  <!-- Connectors: Tier 1 to Tier 2 -->
  <path d="M 460 147 L 460 175" stroke="#29332C" stroke-width="1.5" fill="none"/>
  <path d="M 175 175 L 745 175" stroke="#29332C" stroke-width="1.5" fill="none"/>
  
  <path d="M 175 175 L 175 200" stroke="#AFE746" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 460 175 L 460 200" stroke="#AFE746" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 745 175 L 745 200" stroke="#AFE746" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- TIER 2: SPECIALIZED LAYERS -->
  <!-- FRONTEND -->
  <g transform="translate(60, 206)">
    <rect width="230" height="135" rx="8" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#101412"/>
    <text x="14" y="20" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">FRONTEND</text>

    <g transform="translate(18, 54)" fill="#B8C0BA" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="0">├─ React</text>
      <text x="0" y="26">├─ Next.js</text>
      <text x="0" y="52">└─ Browser Client</text>
    </g>
  </g>

  <!-- BACKEND -->
  <g transform="translate(345, 206)">
    <rect width="230" height="135" rx="8" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#101412"/>
    <text x="14" y="20" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">BACKEND</text>

    <g transform="translate(18, 54)" fill="#B8C0BA" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="0">├─ Node.js</text>
      <text x="0" y="26">├─ REST APIs</text>
      <text x="0" y="52">└─ WebSocket Engine</text>
    </g>
  </g>

  <!-- SYSTEMS -->
  <g transform="translate(630, 206)">
    <rect width="230" height="135" rx="8" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <rect x="0" y="0" width="230" height="30" rx="8" fill="#101412"/>
    <text x="14" y="20" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEMS</text>

    <g transform="translate(18, 54)" fill="#B8C0BA" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="0">├─ C++ Runtime</text>
      <text x="0" y="26">├─ Low-Level Network</text>
      <text x="0" y="52">└─ Game / Socket Servers</text>
    </g>
  </g>

  <!-- Connectors: Tier 2 to Tier 3 -->
  <path d="M 175 341 L 175 365" stroke="#29332C" stroke-width="1.5" fill="none"/>
  <path d="M 460 341 L 460 365" stroke="#29332C" stroke-width="1.5" fill="none"/>
  <path d="M 745 341 L 745 365" stroke="#29332C" stroke-width="1.5" fill="none"/>
  <path d="M 175 365 L 745 365" stroke="#29332C" stroke-width="1.5" fill="none"/>
  <path d="M 460 365 L 460 388" stroke="#AFE746" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- TIER 3: DATA -->
  <g transform="translate(180, 395)">
    <rect width="560" height="74" rx="8" fill="#0D100F" stroke="#202722" stroke-width="1"/>
    <text x="24" y="28" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PERSISTENCE &amp; MEMORY</text>
    
    <g transform="translate(24, 52)" fill="#F2F5F2" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="600">
      <text x="0" y="0">MongoDB <tspan fill="#737B75">[Doc Store]</tspan></text>
      <text x="180" y="0">PostgreSQL <tspan fill="#737B75">[Relational]</tspan></text>
      <text x="380" y="0">Redis <tspan fill="#737B75">[In-Memory Cache]</tspan></text>
    </g>
  </g>

  <!-- Connectors: Tier 3 to Tier 4 -->
  <path d="M 460 469 L 460 495" stroke="#AFE746" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- TIER 4: INFRASTRUCTURE -->
  <g transform="translate(180, 502)">
    <rect width="560" height="85" rx="8" fill="#101412" stroke="#29332C" stroke-width="1"/>
    <rect x="0" y="0" width="560" height="3" fill="#7FAF32" rx="1"/>
    
    <text x="24" y="26" fill="#AFE746" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">INFRASTRUCTURE &amp; DEPLOYMENT</text>
    
    <g transform="translate(24, 54)" fill="#B8C0BA" font-family="'JetBrains Mono', monospace" font-size="12">
      <text x="0" y="0">Linux VPS Host</text>
      <text x="135" y="0">Nginx Reverse Proxy</text>
      <text x="305" y="0">PM2 Runtime</text>
      <text x="415" y="0">Git Pipeline</text>
    </g>
  </g>
</svg>
