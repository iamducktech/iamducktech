<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <rect width="920" height="180" rx="12" fill="#050505"/>
  <rect x="1" y="1" width="918" height="178" rx="11" fill="#080808" stroke="#202722" stroke-width="1"/>

  <!-- Top Circuit Accent -->
  <line x1="32" y1="2" x2="888" y2="2" stroke="#AFE746" stroke-width="2" stroke-opacity="0.8"/>

  <g transform="translate(460, 68)" text-anchor="middle">
    <!-- Primary Engineering Protocol Statement -->
    <text x="0" y="0" fill="#F2F5F2" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="17" font-weight="800" letter-spacing="3.5">
      DESIGN <tspan fill="#AFE746">→</tspan> BUILD <tspan fill="#AFE746">→</tspan> BREAK <tspan fill="#AFE746">→</tspan> OPTIMIZE <tspan fill="#AFE746">→</tspan> SHIP
    </text>
    
    <!-- Subtitle / Signature -->
    <text x="0" y="38" fill="#737B75" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" letter-spacing="1">
      © Duck · Built with code, caffeine and unreasonable attention to detail.
    </text>

    <!-- Node Endpoints Indicator -->
    <g transform="translate(-160, 64)">
      <circle cx="0" cy="0" r="2.5" fill="#AFE746"/>
      <line x1="0" y1="0" x2="320" y2="0" stroke="#202722" stroke-width="1"/>
      <circle cx="320" cy="0" r="2.5" fill="#AFE746"/>
    </g>
  </g>
